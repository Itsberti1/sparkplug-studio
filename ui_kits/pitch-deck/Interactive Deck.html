<script>
(function(){
  // The Portal (Concepts hub) isn't part of the AI Glasses deck — keep the
  // slide-count/prev/next overlay hidden while it's showing, and only
  // reveal it once a card has navigated into the actual deck.
  var ds = document.querySelector('deck-stage');
  function applyHubChrome(index){
    var overlay = ds.shadowRoot && ds.shadowRoot.querySelector('.overlay');
    if(overlay) overlay.style.display = index === 0 ? 'none' : '';
  }
  ds.addEventListener('slidechange', function(e){ applyHubChrome(e.detail.index); });
  applyHubChrome(0);
})();
</script>
